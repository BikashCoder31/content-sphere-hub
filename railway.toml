[build]
builder = "RAILPACK"
buildCommand = "pnpm build:shared && pnpm build:backend"
watchPatterns = [
  "/packages/backend/**",
  "/packages/shared/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/tsconfig.base.json",
  "/railway.toml"
]

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
